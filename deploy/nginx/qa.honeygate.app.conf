limit_req_zone $binary_remote_addr zone=viewport_witness_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=viewport_witness_conn:10m;
include /etc/nginx/snippets/cloudflare-origin-check.conf;

server {
    listen 80;
    listen [::]:80;
    server_name qa.honeygate.app;
    return 301 https://qa.honeygate.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qa.honeygate.app;

    ssl_certificate /etc/ssl/cloudflare/honeygate.app.pem;
    ssl_certificate_key /etc/ssl/cloudflare/honeygate.app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    if ($viewport_from_cloudflare = 0) {
        return 444;
    }

    client_max_body_size 12k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    location / {
        limit_req zone=viewport_witness_api burst=30 nodelay;
        limit_conn viewport_witness_conn 20;
        proxy_pass http://127.0.0.1:3402;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
