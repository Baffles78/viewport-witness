name: viewport-witness

services:
  viewport-witness:
    build:
      context: ..
    container_name: viewport-witness
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: "1.5"
    pids_limit: 256
    ports:
      - "127.0.0.1:3402:3000"
    env_file:
      - ${VIEWPORT_WITNESS_ENV_FILE:-/etc/viewport-witness/viewport-witness.env}
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      SCREENSHOTS_DIR: /data/screenshots
      DB_PATH: /data/vw.db
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    volumes:
      - vw-data:/data
      - vw-tmp:/tmp
    networks:
      browser-egress:
        ipv4_address: 172.31.250.10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  browser-egress:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1

volumes:
  vw-data:
  vw-tmp:
